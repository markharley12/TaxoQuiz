# Publishes the frontend to GitHub Pages: https://markharley12.github.io/TaxoQuiz/
#
# The site is the same static build the Android app wraps. The game runs in the
# browser (frontend/src/engine/), so there is no server to deploy — only files.
# The frontend tests run first, so a broken master never replaces a working site.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# One deploy at a time. Not cancelled mid-flight: a half-published site is worse
# than one that is a push behind.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --run
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

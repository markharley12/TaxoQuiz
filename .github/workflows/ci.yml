# Both suites, on every push and pull request.
#
# Neither one touches the network, and `tests/conftest.py` points
# $TAXOQUIZ_DATA_DIR at an empty tmp dir so nothing here depends on a scrape
# existing — that hermeticity was built for this file, so if a test ever needs
# `data/` the fix is the test, not the workflow.
#
# Actions are on their v7 majors (Sep 2026). v4 of checkout and setup-node, and
# v5 of setup-python, targeted Node 20, which GitHub deprecated and was forcing
# onto Node 24 with a warning on every job. Dependabot keeps them current now.
name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject.toml, and the version developed on.
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 11, because it writes package-lock.json on the development machine and
      # Node 22's bundled npm 10 rejects some of what it writes: after an
      # `npm update` it failed `npm ci` with "lock file's yaml@1.10.3 does not
      # satisfy yaml@2.9.1" while npm 11 installed the same file cleanly.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --run
      # The build is a test in its own right: .gitignore is anchored (`/data/`)
      # so that hatchling keeps the packaged example, and an unanchored rule
      # dropped it out of the wheel silently once.
      - run: npm run build

  wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install build
      - run: python -m build --wheel
      # The example dataset must be inside the wheel, or a fresh install is
      # unplayable. This has broken before, from a .gitignore pattern.
      - name: The wheel carries the packaged example
        run: |
          python - <<'EOF'
          import glob, zipfile, sys
          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          missing = [f for f in (
              "taxoquiz/data/example_tree.json",
              "taxoquiz/data/example_taxon_info.json",
          ) if f not in names]
          if missing:
              sys.exit(f"{wheel} is missing {missing}")
          print(f"{wheel} carries both example files")
          EOF

  # The Android APK, so a change that breaks the native build fails here instead
  # of on the next machine to build it. That has already happened once without CI
  # noticing: the first APK build left generated JavaScript in android/ that
  # failed lint, on a machine that was the only place it could.
  #
  # The APK is kept as an artifact, downloadable from the run's page. Each run
  # signs it with a fresh debug key, so one will not install over another —
  # uninstall the old app first.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            frontend/android/**/*.gradle*
            frontend/android/**/gradle-wrapper.properties
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # npm 11, because it writes package-lock.json on the development machine and
      # Node 22's bundled npm 10 rejects some of what it writes: after an
      # `npm update` it failed `npm ci` with "lock file's yaml@1.10.3 does not
      # satisfy yaml@2.9.1" while npm 11 installed the same file cleanly.
      - run: npm install -g npm@11
      - run: npm ci
      # The runner image ships an Android SDK and sets $ANDROID_HOME, which
      # Gradle reads in place of the gitignored local.properties.
      - run: npm run android:apk
      - uses: actions/upload-artifact@v7
        with:
          name: taxoquiz-debug-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

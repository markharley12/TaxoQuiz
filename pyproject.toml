[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taxoquiz"
version = "0.1.0"
description = "A phylogenetic animal guessing game built on real taxonomy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
]

[project.optional-dependencies]
# Only needed to build your own dataset — see datagen/. The game itself runs on
# the bundled example tree and needs no network.
datagen = ["requests"]
# Only needed to run the suite. httpx2 is what FastAPI's TestClient drives the
# app through — httpx 1.x also works but Starlette deprecates it; neither is
# imported by the game or the scrapers.
#
# It pulls in datagen because tests/test_scraper_incremental.py imports
# datagen/scraper.py, which imports requests: without it pytest does not fail
# those tests, it aborts collection and runs none of the other 170 either. This
# does not make requests a dependency of the game — the game still never imports
# datagen, and `pip install -e .` is still fastapi and uvicorn alone.
test = ["pytest", "httpx2", "taxoquiz[datagen]"]

[tool.hatch.build.targets.wheel]
packages = ["src/taxoquiz"]
